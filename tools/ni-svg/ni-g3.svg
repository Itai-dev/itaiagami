  <text x="152" y="160" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" letter-spacing="1.9" fill="rgba(236,236,236,.28)" text-anchor="start">DESIGNING FOR VARIATION</text>
  <text x="152" y="242" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="52" font-weight="400" letter-spacing="-1.2" fill="#ececec" text-anchor="start">A variation should test an idea, not decorate it.</text>
  <text x="152" y="292" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="rgba(236,236,236,.55)" text-anchor="start">Change the strategic variable — not the colour of the button.</text>
  <line x1="152" y1="390" x2="1448" y2="390" stroke="rgba(236,236,236,.14)" stroke-width="1"/><text x="152" y="412" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" letter-spacing="1.9" fill="rgba(236,236,236,.28)" text-anchor="start">01</text><text x="250" y="422" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" letter-spacing="0" fill="#ececec" text-anchor="start">Core concept</text><text x="660" y="422" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" letter-spacing="0" fill="rgba(236,236,236,.55)" text-anchor="start">Price-discrepancy hook</text><line x1="152" y1="478" x2="1448" y2="478" stroke="rgba(236,236,236,.14)" stroke-width="1"/><text x="152" y="500" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" letter-spacing="1.9" fill="rgba(236,236,236,.28)" text-anchor="start">02</text><text x="250" y="510" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" letter-spacing="0" fill="#ececec" text-anchor="start">Format adaptation</text><text x="660" y="510" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" letter-spacing="0" fill="rgba(236,236,236,.55)" text-anchor="start">9:16  /  1:1  /  16:9</text><line x1="152" y1="566" x2="1448" y2="566" stroke="rgba(236,236,236,.14)" stroke-width="1"/><text x="152" y="588" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" letter-spacing="1.9" fill="rgba(236,236,236,.28)" text-anchor="start">03</text><text x="250" y="598" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" letter-spacing="0" fill="#ececec" text-anchor="start">Hook variation</text><text x="660" y="598" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" letter-spacing="0" fill="rgba(236,236,236,.55)" text-anchor="start">Statement / question / comparison</text><line x1="152" y1="654" x2="1448" y2="654" stroke="rgba(236,236,236,.14)" stroke-width="1"/><text x="152" y="676" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" letter-spacing="1.9" fill="rgba(236,236,236,.28)" text-anchor="start">04</text><text x="250" y="686" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" letter-spacing="0" fill="#ececec" text-anchor="start">Proof point</text><text x="660" y="686" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" letter-spacing="0" fill="rgba(236,236,236,.55)" text-anchor="start">Savings figure / time to switch / trust signal</text><line x1="152" y1="742" x2="1448" y2="742" stroke="rgba(236,236,236,.14)" stroke-width="1"/><text x="152" y="764" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" letter-spacing="1.9" fill="#F25C05" text-anchor="start">05</text><text x="250" y="774" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" letter-spacing="0" fill="#F25C05" text-anchor="start">Performance signal</text><text x="660" y="774" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" letter-spacing="0" fill="rgba(236,236,236,.55)" text-anchor="start">Informs the next round of concepts</text><line x1="152" y1="830" x2="1448" y2="830" stroke="rgba(236,236,236,.14)" stroke-width="1"/>
